<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">HR-Driven NAC and DHCP Automation Lab</title>
  <desc id="desc">From HR policy to verified network state. Oracle HR, RADIUS, VLAN, DHCP, and DONE.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22344a" stroke-width="0.7"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1828"/><stop offset="1" stop-color="#14283a"/></linearGradient>
  </defs>
  <rect width="1400" height="430" rx="20" fill="url(#bg)"/>
  <rect width="1400" height="430" rx="20" fill="url(#grid)" opacity=".55"/>
  <path d="M48 60H100" stroke="#56ddbf" stroke-width="5"/>
  <text x="116" y="65" fill="#7fe3ce" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="3">NETWORK ENGINEERING / AUTOMATION</text>
  <text x="48" y="144" fill="#f4f8fc" font-family="Segoe UI,Arial,sans-serif" font-size="55" font-weight="700">HR-Driven NAC</text>
  <text x="48" y="204" fill="#f4f8fc" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="600">&amp; DHCP Automation Lab</text>
  <text x="48" y="249" fill="#b9cada" font-family="Segoe UI,Arial,sans-serif" font-size="21">From HR policy to verified network state.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    <path d="M245 326H282M482 326H519M719 326H756M956 326H993" stroke="#658297" stroke-width="2"/>
    <rect x="48" y="295" width="197" height="62" rx="12" fill="#1a3045" stroke="#38536b"/><text x="146" y="333" fill="#e4edf5">Oracle HR</text>
    <rect x="282" y="295" width="200" height="62" rx="12" fill="#1a3045" stroke="#38536b"/><text x="382" y="333" fill="#e4edf5">RADIUS / CoA</text>
    <rect x="519" y="295" width="200" height="62" rx="12" fill="#1a3045" stroke="#38536b"/><text x="619" y="333" fill="#e4edf5">Dynamic VLAN</text>
    <rect x="756" y="295" width="200" height="62" rx="12" fill="#1a3045" stroke="#38536b"/><text x="856" y="333" fill="#e4edf5">DHCP / IPAM</text>
    <rect x="993" y="295" width="190" height="62" rx="12" fill="#123e3b" stroke="#56ddbf"/><text x="1088" y="333" fill="#87f0d9">DONE</text>
  </g>
  <text x="48" y="394" fill="#829aad" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2">GRAYHATPYTHON</text>
  <text x="1348" y="394" text-anchor="end" fill="#829aad" font-family="Segoe UI,Arial,sans-serif" font-size="15">EVE-NG / PERSONAL LAB</text>
</svg>
